let state={dogs:[],volunteers:[],shiftHistory:{},checkedTasks:{},taskAttribution:{},adHocTasks:{},shiftPlan:{},cleanHistory:{},specialAssignments:{},aiBriefings:{},profileFlags:[],settings:{...DEFAULT_SETTINGS}};

function loadState(){
  const r=store.get('shelter-state');
  if(r&&r.value){
    try{
      const s=JSON.parse(r.value);
      state.dogs=s.dogs&&s.dogs.length?s.dogs:DEFAULT_DOGS;
      state.volunteers=s.volunteers&&s.volunteers.length?s.volunteers:DEFAULT_VOLUNTEERS;
      state.shiftHistory=s.shiftHistory||{};state.checkedTasks=s.checkedTasks||{};
      state.taskAttribution=s.taskAttribution||{};
      state.adHocTasks=s.adHocTasks||{};state.shiftPlan=s.shiftPlan||{};
      state.cleanHistory=s.cleanHistory||{};state.specialAssignments=s.specialAssignments||{};
      state.aiBriefings=s.aiBriefings||{};
      state.profileFlags=s.profileFlags||[];
      state.settings={...DEFAULT_SETTINGS,...(s.settings||{})};
      const sk=shiftKey();
      if(state.shiftPlan[sk]&&state.shiftPlan[sk].capacityVersion!==2){state.shiftPlan[sk]=buildShiftPlan(getAvailableVols(currentShift()),currentShift());saveState();}
    }catch(e){state.dogs=DEFAULT_DOGS;state.volunteers=DEFAULT_VOLUNTEERS;}
  }else{state.dogs=DEFAULT_DOGS;state.volunteers=DEFAULT_VOLUNTEERS;}
  renderAll();
}
function saveState(){store.set('shelter-state',JSON.stringify(state));}

// Helpers
function today(){return new Date().toISOString().slice(0,10);}
function todayDisplay(){return new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function currentShift(){return new Date().getHours()<14?'Morning':'Evening';}
function shiftKey(){return today()+'-'+currentShift();}
function prevShiftKey(){const s=currentShift();if(s==='Evening')return today()+'-Morning';const p=new Date();p.setDate(p.getDate()-1);return p.toISOString().slice(0,10)+'-Evening';}
function volunteerStays(v){return Array.isArray(v.stays)?v.stays.filter(s=>s&&s.start&&s.end):[];}
function isVolunteerPresentOn(v,dateStr=today()){
  const stays=volunteerStays(v);
  return !stays.length||stays.some(s=>s.start<=dateStr&&dateStr<=s.end);
}
function volunteerStatus(v,dateStr=today()){
  if(isVolunteerPresentOn(v,dateStr))return'active';
  return volunteerStays(v).some(s=>s.start>dateStr)?'upcoming':'past';
}
function formatStayDate(dateStr){if(!dateStr)return'';const [y,m,d]=dateStr.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function volunteerStaySummary(v){const stays=volunteerStays(v);if(!stays.length)return'No stay dates set · currently active';return stays.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(s=>`${formatStayDate(s.start)} – ${formatStayDate(s.end)}`).join(' · ');}
function getAvailableVols(shift,dateStr=today()){const d=new Date(dateStr+'T12:00:00'),dn=dayNameFromDate(d);return state.volunteers.filter(v=>isVolunteerPresentOn(v,dateStr)&&!(v.offShifts||[]).find(o=>o.day===dn&&o.shift===shift));}
function daysSinceWalked(dog){const hist=(state.shiftHistory[dog.id]||[]).filter(h=>h.walked).sort((a,b)=>b.date.localeCompare(a.date));if(!hist.length)return 999;return Math.floor((new Date(today())-new Date(hist[0].date))/(1000*60*60*24));}
function tagClass(t){if(['Biter','Caution'].includes(t))return'badge-danger';if(['Medication','Medical'].includes(t))return'badge-warning';if(['Needs 2 people','Carry out'].includes(t))return'badge-info';return'badge-success';}
function ragDot(rag){return`<span class="rag-dot rag-${rag||'green'}"></span>`;}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function noteCategory(note){return['medication','food','walk','general'].includes(note&&note.category)?note.category:'general';}
function noteCategoryLabel(category){return({medication:'Medication',food:'Food',walk:'Walk',general:'General'})[category]||'General';}
function noteCategoryClass(category){return category==='medication'?'badge-warning':category==='walk'?'badge-info':category==='food'?'badge-success':'';}
function openProfileFlags(dogId){return(state.profileFlags||[]).filter(f=>f.dogId===dogId&&!f.dismissed);}
function inlineNoteControls(dogId,category,placeholder){
  const label=noteCategoryLabel(category);
  return`<button class="btn btn-sm" style="margin-top:4px;font-size:11px" onclick="toggleInlineNote('${dogId}','${category}')"><i class="ti ti-pencil"></i> ${label} note</button>
    <div id="inline-note-${category}-${dogId}" style="display:none" class="inline-note-form">
      <textarea id="inline-note-text-${category}-${dogId}" placeholder="${placeholder}" rows="2" style="margin-bottom:6px;font-size:12px"></textarea>
      <input type="text" id="inline-note-vol-${category}-${dogId}" list="volunteer-suggestions" placeholder="Volunteer name" autocomplete="off" style="margin-bottom:6px;font-size:12px">
      <button class="btn btn-sm btn-primary" onclick="saveInlineNote('${dogId}','${category}')">Save ${label.toLowerCase()} note</button>
    </div>`;
}
function volName(id){const v=state.volunteers.find(x=>x.id===id);return v?v.name:id;}
function dogPhoto(d){if(d.photo)return`<div style="width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${d.photo}" style="width:100%;height:100%;object-fit:cover"></div>`;return`<div style="width:40px;height:40px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;color:var(--color-text-info);flex-shrink:0">${d.name[0]}</div>`;}
function getWeekDates(){const now=new Date();const day=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1));return DAYS_WEEK.map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function dayNameFromDate(d){return DAYS_WEEK[d.getDay()===0?6:d.getDay()-1];}
function todayDayName(){return dayNameFromDate(new Date());}
function isToday(d){const n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isPast(d){const n=new Date();n.setHours(0,0,0,0);return d<n;}
function weekKey(){const d=new Date();const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));return mon.toISOString().slice(0,10);}

// Capacity calculation from settings
function adHocMins(sk){
  const tasks=state.adHocTasks[sk]||[];
  return tasks.reduce((sum,t)=>sum+(t.mins||0),0);
}
function calcCapacity(vols,cleanerIds,sk){
  const s=state.settings;
  const shiftMins=180;
  const extraMins=sk?adHocMins(sk):0;
  const nonCleaners=vols.filter(v=>!cleanerIds.includes(v.id)).length;
  const cleaners=cleanerIds.length;
  const nonCleanerWalkMins=Math.max(0,shiftMins-s.feedMins-s.specialMins-extraMins);
  const cleanerWalkMins=Math.max(0,shiftMins-s.cleanMins-s.specialMins-extraMins);
  return Math.floor(nonCleanerWalkMins/s.walkMins)*nonCleaners+Math.floor(cleanerWalkMins/s.walkMins)*cleaners;
}

function walkPeopleRequired(dog){
  const tags=dog.tags||[];
  const instructions=`${dog.walk&&dog.walk.harnessing||''} ${dog.notes||''}`;
  return tags.includes('Needs 2 people')||/\b(?:needs|requires?)\s+(?:two|2)\s+people\b/i.test(instructions)?2:1;
}

function pickCleaners(vols){
  if(!vols.length)return[];if(vols.length===1)return[vols[0].id];
  const prev=state.cleanHistory[prevShiftKey()]||[];
  return[...vols.filter(v=>!prev.includes(v.id)),...vols.filter(v=>prev.includes(v.id))].slice(0,2).map(v=>v.id);
}

function buildSpecialAssignments(allVolIds){
  const wk=weekKey();
  if(state.specialAssignments[wk])return state.specialAssignments[wk];
  const pool=[...state.dogs.filter(d=>!d.archived&&!d.adopted&&d.rag==='red'),...state.dogs.filter(d=>!d.archived&&!d.adopted&&d.rag==='amber')];
  const assign={};let idx=0;
  allVolIds.forEach(vid=>{assign[vid]=[];for(let i=0;i<2;i++){if(idx<pool.length){assign[vid].push(pool[idx].id);idx++;}}});
  state.specialAssignments[wk]=assign;saveState();return assign;
}

function buildShiftPlan(vols,shift){
  const s=state.settings;
  const sk=shiftKey();
  const cleanerIds=pickCleaners(vols);
  const cap=calcCapacity(vols,cleanerIds,sk);
  const prioritized=state.dogs.filter(d=>d.canWalk&&!d.adopted&&!d.archived).sort((a,b)=>daysSinceWalked(b)-daysSinceWalked(a));
  const walkable=[];let remainingWalkSlots=cap;
  prioritized.forEach(d=>{const slots=walkPeopleRequired(d);if(slots<=remainingWalkSlots){walkable.push(d);remainingWalkSlots-=slots;}});
  const feedDogs=state.dogs.filter(d=>!d.adopted&&!d.archived&&(shift==='Morning'||d.feedingShifts==='both'));
  const medDogs=state.dogs.filter(d=>!d.adopted&&!d.archived&&d.meds&&d.meds.what&&d.meds.what.trim());
  const nonWalkable=state.dogs.filter(d=>!d.canWalk&&!d.adopted&&!d.archived);
  const specialAssign=buildSpecialAssignments(vols.map(v=>v.id));
  return{
    capacityVersion:2,
    cleaners:cleanerIds,nonCleaners:vols.filter(v=>!cleanerIds.includes(v.id)).map(v=>v.id),
    walkDogs:walkable.map(d=>({id:d.id,name:d.name,harness:d.walk.harness,handling:d.walk.handling,tags:d.tags||[],daysSince:daysSinceWalked(d),peopleRequired:walkPeopleRequired(d)})),
    walkSlotsUsed:cap-remainingWalkSlots,walkSlotCapacity:cap,
    feedDogs:feedDogs.map(d=>({id:d.id,name:d.name,amount:d.food.amount,type:d.food.type,alone:d.food.alone,placement:d.food.placement,tags:d.tags||[]})),
    medDogs:medDogs.map(d=>({id:d.id,name:d.name,what:d.meds.what,how:d.meds.how})),
    cuddles:nonWalkable.map(d=>({id:d.id,name:d.name,task:(d.tags||[]).includes('Harness training')?'Harness training':'Cuddles & socialisation'})),
    specialAssign
  };
}

// Attribution modal
function showAttrModal(title,key,onConfirm){
  const input=document.getElementById('attr-vol-input');
  input.value='';
  document.getElementById('attr-modal-title').textContent=title;
  document.getElementById('attr-modal').style.display='flex';
  setTimeout(()=>input.focus(),0);
  attrCallback=onConfirm;attrKey=key;
}
function confirmAttribution(){
  const volunteer=document.getElementById('attr-vol-input').value.trim();
  if(!volunteer){document.getElementById('attr-vol-input').focus();return;}
  document.getElementById('attr-modal').style.display='none';
  if(attrCallback)attrCallback(volunteer);
  attrCallback=null;attrKey=null;
}
function cancelAttribution(){
  document.getElementById('attr-modal').style.display='none';
  attrCallback=null;attrKey=null;
}

function getAttrib(sk,key){return(state.taskAttribution[sk]||{})[key]||null;}
function setAttrib(sk,key,volId){if(!state.taskAttribution[sk])state.taskAttribution[sk]={};state.taskAttribution[sk][key]=volId;}

// SHIFT
function renderShift(){
  const shift=currentShift(),vols=getAvailableVols(shift),sk=shiftKey();
  const plan=state.shiftPlan[sk],adHoc=state.adHocTasks[sk]||[],checked=state.checkedTasks[sk]||{};
  const s=state.settings,times=shift==='Morning'?`${s.morningStart}–${s.morningEnd}`:`${s.eveningStart}–${s.eveningEnd}`;

  let html=`<div class="section-title" style="margin-bottom:2px">${shift} shift · ${times}</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:8px">${vols.length?vols.map(v=>v.name).join(', '):'No volunteers today'}</div>`;

  // Ad hoc tasks — always visible
  html+=`<div style="margin-bottom:1rem">
    <div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Ad hoc tasks</div>`;
  // sort priority tasks first
  const sortedAdHoc=adHoc.map((t,i)=>({...t,origIdx:i})).sort((a,b)=>(b.priority?1:0)-(a.priority?1:0));
  sortedAdHoc.forEach(({origIdx:i,...task})=>{const key='adhoc-'+i;const done=checked[key];const attrib=getAttrib(sk,key);
    html+=`<div style="display:flex;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <input type="checkbox" ${done?'checked':''} onchange="tickAdHoc(${i})" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
      <div style="flex:1">
        ${task.priority?`<span class="badge badge-danger" style="font-size:10px;padding:1px 5px;margin-right:4px">Priority</span>`:''}
        <span class="${done?'done-text':''}" style="font-size:13px">${task.text}</span>
        ${task.mins?`<span style="font-size:11px;color:var(--color-text-secondary)"> · ${task.mins} mins</span>`:''}
        ${task.people>1?`<span style="font-size:11px;color:var(--color-text-secondary)"> · ${task.people} people</span>`:''}
        ${task.assigned?`<span style="font-size:11px;color:var(--color-text-secondary)"> · ${volName(task.assigned)}</span>`:''}
        ${attrib?`<div class="attribution">✓ ${volName(attrib)}</div>`:''}
      </div>
      <button class="btn btn-sm btn-danger" onclick="removeAdHoc(${i})">×</button>
    </div>`;
  });
  html+=`<div style="margin-top:8px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <input type="text" id="adhoc-text" placeholder="Task description..." style="margin:0;flex:2;min-width:140px">
      <input type="number" id="adhoc-mins" placeholder="Mins" style="margin:0;width:58px">
      <input type="number" id="adhoc-people" placeholder="People" style="margin:0;width:62px">
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary);margin:0;cursor:pointer">
        <input type="checkbox" id="adhoc-priority" style="width:14px;height:14px;margin:0"> Priority
      </label>
      <input type="text" id="adhoc-assign" list="volunteer-suggestions" placeholder="Assign to (optional)" autocomplete="off" style="margin:0;flex:1;font-size:12px;min-width:120px">
    </div>
    <button class="btn btn-sm btn-primary" onclick="addAdHoc()">Add task</button>
  </div></div>`;

  if(!plan){
    const previewCleaners=pickCleaners(vols);
    const previewCap=calcCapacity(vols,previewCleaners,sk);
    html+=`<div class="card" style="text-align:center;padding:1.5rem">
      <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:4px">Ready to generate the shift plan</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:1rem">${vols.length} volunteers · ~${previewCap} walks capacity · last ${s.specialMins} mins special dogs${adHocMins(sk)>0?' · '+adHocMins(sk)+' mins ad hoc tasks reduce capacity':''}</div>
      <button class="btn btn-primary" onclick="generatePlan()"><i class="ti ti-player-play"></i> Generate shift plan</button>
    </div>`;
  }else{
    html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem">
      <button class="btn btn-sm" onclick="generatePlan()"><i class="ti ti-refresh"></i> Regenerate</button>
      <button class="btn btn-sm btn-primary" onclick="generateAIBriefing({force:true})"><i class="ti ti-sparkles"></i> Refresh briefing</button>
    </div>`;

    const nonCleanerNames=(plan.nonCleaners||[]).map(id=>volName(id)).join(', ')||'others';

    // CLEANING
    html+=`<div class="shift-header">Cleaning & water · ${plan.cleaners.map(id=>volName(id)).join(' + ')} · ${s.cleanMins} mins</div>`;
    const cd=checked['cleaning'];const ca=getAttrib(sk,'cleaning');
    html+=`<div class="check-row"><input type="checkbox" ${cd?'checked':''} onchange="tickTask('cleaning','Clean all kennels & refill water')" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
      <div><div style="font-weight:500" class="${cd?'done-text':''}">Clean all kennels & refill water</div>
      <div style="font-size:12px;color:var(--color-text-secondary)">${plan.cleaners.map(id=>volName(id)).join(' + ')} · ${s.cleanMins} mins</div>
      ${ca?`<div class="attribution">✓ ${volName(ca)}</div>`:''}
      </div></div>`;

    // MEDS
    if(plan.medDogs&&plan.medDogs.length){
      html+=`<div class="shift-header">Medications · ${nonCleanerNames} · first ${s.feedMins} mins</div>`;
      plan.medDogs.forEach(m=>{const key='med-'+m.id;const done=checked[key];const attrib=getAttrib(sk,key);
        html+=`<div class="check-row"><input type="checkbox" ${done?'checked':''} onchange="tickTask('${key}','Med: ${m.name}')" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
          <div><span style="font-weight:500" class="${done?'done-text':''}">${m.name}</span><span style="font-size:13px"> — ${m.what}</span>
          <div style="font-size:12px;color:var(--color-text-secondary)">${m.how}</div>
          ${attrib?`<div class="attribution">✓ ${volName(attrib)}</div>`:''}
          ${inlineNoteControls(m.id,'medication','Note what was given, refused, changed or observed...')}
          </div></div>`;
      });
    }

    // FEEDING
    html+=`<div class="shift-header">Feeding · ${plan.feedDogs.length} dogs · ${nonCleanerNames} · first ${s.feedMins} mins</div>`;
    plan.feedDogs.forEach(d=>{const key='feed-'+d.id;const done=checked[key];const attrib=getAttrib(sk,key);
      const warns=(d.tags||[]).filter(t=>['Biter','Caution','Tethered feeding'].includes(t));
      html+=`<div class="check-row"><input type="checkbox" ${done?'checked':''} onchange="tickTask('${key}','Fed: ${d.name}')" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
        <div><span style="font-weight:500" class="${done?'done-text':''}">${d.name}</span>${warns.map(w=>`<span class="badge ${tagClass(w)}">${w}</span>`).join('')}
        <span style="font-size:12px;color:var(--color-text-secondary)"> · ${d.amount}${d.type?' · '+d.type:''}</span>
        ${d.alone||d.placement?`<div style="font-size:12px;color:var(--color-text-secondary)">${[d.alone,d.placement].filter(Boolean).join(' · ')}</div>`:''}
        ${attrib?`<div class="attribution">✓ ${volName(attrib)}</div>`:''}
        ${inlineNoteControls(d.id,'food','Note appetite, food amount, feeding behaviour or changes...')}
        </div></div>`;
    });

    // WALKS
    const walkSlotsUsed=plan.walkSlotsUsed??plan.walkDogs.reduce((sum,d)=>sum+(d.peopleRequired||((d.tags||[]).includes('Needs 2 people')?2:1)),0);
    const walkSlotCapacity=plan.walkSlotCapacity??calcCapacity(vols,plan.cleaners,sk);
    html+=`<div class="shift-header">Walks · ${plan.walkDogs.length} dogs · ${walkSlotsUsed}/${walkSlotCapacity} volunteer slots · ${s.walkMins} mins each</div>`;
    html+=`<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">${nonCleanerNames} walk from min ${s.feedMins}. ${plan.cleaners.map(id=>volName(id)).join(' + ')} join after min ${s.cleanMins}. Dogs marked “2 people” use two capacity slots.</div>`;
    plan.walkDogs.forEach(d=>{const key='walk-'+d.id;const done=checked[key];const attrib=getAttrib(sk,key);
      const warns=(d.tags||[]).filter(t=>['Caution','Needs 2 people','Carry out','Gentle walks only'].includes(t));
      const daysText=d.daysSince===0?'today':d.daysSince===1?'yesterday':`${d.daysSince}d ago`;
      html+=`<div class="check-row"><input type="checkbox" ${done?'checked':''} onchange="tickWalk('${d.id}')" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
        <div style="flex:1">
          <div class="${done?'done-text':''}"><span style="font-weight:500">${d.name}</span>${d.harness?`<span style="font-size:12px;color:var(--color-text-secondary)"> · ${d.harness}</span>`:''}${warns.map(w=>`<span class="badge ${tagClass(w)}">${w}</span>`).join('')}<span style="font-size:12px;color:var(--color-text-secondary)"> · ${daysText}</span></div>
          ${d.handling?`<div style="font-size:12px;color:var(--color-text-secondary)">${d.handling}</div>`:''}
          ${attrib?`<div class="attribution">✓ ${volName(attrib)}</div>`:''}
          ${inlineNoteControls(d.id,'walk','Note behaviour, handling, mobility or route changes...')}
        </div>
      </div>`;
    });

    // CUDDLES
    if(plan.cuddles&&plan.cuddles.length){
      html+=`<div class="shift-header">Cuddles & harness training</div>`;
      plan.cuddles.forEach(c=>{const key='cuddle-'+c.id;const done=checked[key];const attrib=getAttrib(sk,key);
        html+=`<div class="check-row"><input type="checkbox" ${done?'checked':''} onchange="tickTask('${key}','${c.task}: ${c.name}')" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
          <div><span style="font-weight:500" class="${done?'done-text':''}">${c.name}</span> — ${c.task}
          ${attrib?`<div class="attribution">✓ ${volName(attrib)}</div>`:''}
          </div></div>`;
      });
    }

    // SPECIAL DOGS
    html+=`<div class="shift-header" style="border-color:var(--color-border-danger)"><span style="color:var(--color-text-danger)">Special dogs · everyone · last ${s.specialMins} mins</span></div>`;
    html+=`<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">Sit, brush, train or walk. 2 per volunteer. <button class="btn btn-sm" onclick="showSpecialEditor()" style="margin-left:4px">Edit</button></div>`;
    const wk=weekKey();const currentAssign=state.specialAssignments[wk]||plan.specialAssign||{};
    vols.forEach(v=>{const dogIds=(currentAssign[v.id]||[]).filter(Boolean);if(!dogIds.length)return;
      const key='special-'+v.id;const done=checked[key];const attrib=getAttrib(sk,key);
      html+=`<div class="check-row"><input type="checkbox" ${done?'checked':''} onchange="tickTask('${key}','Special dogs: ${v.name}')" style="width:16px;height:16px;margin-top:2px;cursor:pointer;flex-shrink:0">
        <div><span style="font-weight:500" class="${done?'done-text':''}">${v.name}</span> — ${dogIds.map(did=>{const dog=state.dogs.find(d=>d.id===did);if(!dog)return'';return`${ragDot(dog.rag)}<span style="font-weight:500">${dog.name}</span>${dog.ragReason?`<span style="font-size:12px;color:var(--color-text-secondary)"> (${dog.ragReason})</span>`:''}`}).join(' · ')}
        ${attrib?`<div class="attribution">✓ ${volName(attrib)}</div>`:''}
        </div></div>`;
    });
    const briefing=state.aiBriefings[sk];
    html+=`<div id="special-editor"></div><div id="ai-briefing-output" style="margin-top:1rem">${briefingMarkup(briefing)}</div>`;
  }
  document.getElementById('tab-shift').innerHTML=html;
  if(plan&&!state.aiBriefings[sk]&&!briefingRequests.has(sk))setTimeout(()=>generateAIBriefing(),0);
}

function tickTask(key,label){
  const sk=shiftKey();
  const alreadyDone=(state.checkedTasks[sk]||{})[key];
  if(alreadyDone){
    // untick — remove
    state.checkedTasks[sk][key]=false;
    if(state.taskAttribution[sk])delete state.taskAttribution[sk][key];
    saveState();renderShift();return;
  }
  showAttrModal(`Who did: ${label}?`,key,(volId)=>{
    if(!state.checkedTasks[sk])state.checkedTasks[sk]={};
    state.checkedTasks[sk][key]=true;
    setAttrib(sk,key,volId);
    saveState();renderShift();
  });
}

function tickWalk(dogId){
  const sk=shiftKey();const key='walk-'+dogId;
  const alreadyDone=(state.checkedTasks[sk]||{})[key];
  if(alreadyDone){
    state.checkedTasks[sk][key]=false;
    if(state.taskAttribution[sk])delete state.taskAttribution[sk][key];
    // remove walk history entry for today
    state.shiftHistory[dogId]=(state.shiftHistory[dogId]||[]).filter(h=>h.date!==today()||h.shift!==currentShift());
    saveState();renderShift();return;
  }
  const dog=state.dogs.find(d=>d.id===dogId);
  showAttrModal(`Who walked ${dog?dog.name:dogId}?`,key,(volId)=>{
    if(!state.checkedTasks[sk])state.checkedTasks[sk]={};
    state.checkedTasks[sk][key]=true;
    setAttrib(sk,key,volId);
    if(!state.shiftHistory[dogId])state.shiftHistory[dogId]=[];
    state.shiftHistory[dogId].push({date:today(),walked:true,shift:currentShift(),by:volId});
    saveState();renderShift();
  });
}

function tickAdHoc(i){
  const sk=shiftKey();const key='adhoc-'+i;
  const alreadyDone=(state.checkedTasks[sk]||{})[key];
  if(alreadyDone){
    state.checkedTasks[sk][key]=false;
    if(state.taskAttribution[sk])delete state.taskAttribution[sk][key];
    saveState();renderShift();return;
  }
  const task=state.adHocTasks[sk][i];
  showAttrModal(`Who did: ${task.text}?`,key,(volId)=>{
    if(!state.checkedTasks[sk])state.checkedTasks[sk]={};
    state.checkedTasks[sk][key]=true;
    setAttrib(sk,key,volId);
    saveState();renderShift();
  });
}

function toggleInlineNote(dogId,category){
  const el=document.getElementById(`inline-note-${category}-${dogId}`);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

function saveInlineNote(dogId,category){
  const text=document.getElementById(`inline-note-text-${category}-${dogId}`).value.trim();
  const volId=document.getElementById(`inline-note-vol-${category}-${dogId}`).value.trim();
  if(!text)return;
  const d=state.dogs.find(x=>x.id===dogId);if(!d)return;
  if(!d.dogNotes)d.dogNotes=[];
  d.dogNotes.unshift({date:today(),shift:currentShift(),volunteer:volName(volId)||'Volunteer',category,text});
  saveState();
  document.getElementById(`inline-note-${category}-${dogId}`).style.display='none';
  // show confirmation briefly
  const btn=document.querySelector(`button[onclick="toggleInlineNote('${dogId}','${category}')"]`);
  if(btn){const orig=btn.innerHTML;btn.innerHTML='✓ Saved to profile';setTimeout(()=>{btn.innerHTML=orig;},1500);}
}

function addAdHoc(){
  const text=document.getElementById('adhoc-text').value.trim();if(!text)return;
  const mins=parseInt(document.getElementById('adhoc-mins').value)||0;
  const people=parseInt(document.getElementById('adhoc-people').value)||1;
  const priority=document.getElementById('adhoc-priority').checked;
  const assignEl=document.getElementById('adhoc-assign');
  const assigned=assignEl?assignEl.value:'';
  const sk=shiftKey();
  if(!state.adHocTasks[sk])state.adHocTasks[sk]=[];
  state.adHocTasks[sk].push({text,mins:mins||null,people,priority,assigned});
  // if plan exists and task has duration, prompt regenerate
  if(state.shiftPlan[sk]&&mins>0){
    if(confirm('This task takes '+mins+' mins and will affect walk capacity. Regenerate shift plan?')){
      generatePlan();return;
    }
  }
  saveState();renderShift();
}

function removeAdHoc(i){
  const sk=shiftKey();state.adHocTasks[sk].splice(i,1);saveState();renderShift();
}

function generatePlan(){
  const shift=currentShift(),vols=getAvailableVols(shift),sk=shiftKey();
  const plan=buildShiftPlan(vols,shift);
  state.shiftPlan[sk]=plan;state.cleanHistory[sk]=plan.cleaners;
  delete state.aiBriefings[sk];
  briefingRequests.delete(sk);
  saveState();renderShift();
}

function showSpecialEditor(){
  const wk=weekKey();const plan=state.shiftPlan[shiftKey()];if(!plan)return;
  const vols=getAvailableVols(currentShift());
  const ragDogs=state.dogs.filter(d=>!d.archived&&!d.adopted&&(d.rag==='red'||d.rag==='amber'));
  const current=state.specialAssignments[wk]||{};
  let html=`<div class="card" style="margin-top:1rem"><div style="font-weight:500;margin-bottom:10px">Edit this week's special dog assignments</div>`;
  vols.forEach(v=>{const assigned=current[v.id]||[];
    html+=`<div style="margin-bottom:10px"><div style="font-size:13px;font-weight:500;margin-bottom:4px">${v.name}</div>`;
    for(let i=0;i<2;i++){html+=`<select onchange="updateSpecialAssign('${v.id}',${i},this.value)" style="margin-bottom:4px"><option value="">— none —</option>${ragDogs.map(d=>`<option value="${d.id}" ${assigned[i]===d.id?'selected':''}>${d.rag==='red'?'🔴':'🟡'} ${d.name}${d.ragReason?' — '+d.ragReason:''}</option>`).join('')}</select>`;}
    html+=`</div>`;
  });
  html+=`<button class="btn btn-sm btn-primary" onclick="document.getElementById('special-editor').innerHTML=''">Done</button></div>`;
  document.getElementById('special-editor').innerHTML=html;
}
function updateSpecialAssign(vid,idx,dogId){const wk=weekKey();if(!state.specialAssignments[wk])state.specialAssignments[wk]={};if(!state.specialAssignments[wk][vid])state.specialAssignments[wk][vid]=[];state.specialAssignments[wk][vid][idx]=dogId;saveState();}

function briefingMarkup(briefing){
  if(!briefing)return'<div style="font-size:13px;color:var(--color-text-secondary)"><i class="ti ti-sparkles"></i> AI briefing will generate automatically.</div>';
  const paragraphs=escapeHtml(briefing.text).split(/\n{2,}/).map(p=>`<p style="margin-bottom:8px">${p.replace(/\n/g,'<br>')}</p>`).join('');
  const flags=briefing.profileFlags||[];
  const review=flags.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--color-border-warning)"><strong><i class="ti ti-alert-triangle"></i> ${flags.length} profile review suggestion${flags.length===1?'':'s'}</strong><div style="font-size:12px;color:var(--color-text-secondary);margin-top:3px">Open the highlighted dog profiles to review them.</div></div>`:'';
  return`<div class="ai-output"><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px"><i class="ti ti-sparkles"></i> AI shift briefing · generated ${escapeHtml(briefing.generatedAtLabel)}</div>${paragraphs}${review}</div>`;
}

function briefingPayload(shift,vols,plan,s){
  const times=shift==='Morning'?`${s.morningStart}–${s.morningEnd}`:`${s.eveningStart}–${s.eveningEnd}`;
  const assigned=state.specialAssignments[weekKey()]||plan.specialAssign||{};
  return{
    shelter:'Kentavros dog rescue shelter',date:todayDisplay(),shift,times,
    volunteers:vols.map(v=>v.name),cleaners:plan.cleaners.map(id=>volName(id)),
    feedMinutes:s.feedMins,cleanMinutes:s.cleanMins,specialMinutes:s.specialMins,
    dogsToWalk:plan.walkDogs.map(d=>({name:d.name,handling:d.handling,tags:d.tags,daysSinceWalk:d.daysSince,peopleRequired:d.peopleRequired||((d.tags||[]).includes('Needs 2 people')?2:1)})),
    medications:plan.medDogs.map(d=>({name:d.name,medication:d.what,instructions:d.how})),
    feeding:plan.feedDogs.map(d=>({name:d.name,amount:d.amount,type:d.type,notes:[d.alone,d.placement].filter(Boolean).join(' · '),tags:d.tags})),
    specialDogs:Object.entries(assigned).map(([volunteerId,dogIds])=>({volunteer:volName(volunteerId),dogs:(dogIds||[]).map(id=>{const d=state.dogs.find(x=>x.id===id);return d?{name:d.name,status:d.rag,reason:d.ragReason}:null;}).filter(Boolean)})),
    adHocTasks:(state.adHocTasks[shiftKey()]||[]).map(t=>({text:t.text,minutes:t.mins||0,people:t.people||1,priority:!!t.priority,assigned:t.assigned?volName(t.assigned):''})),
    dogProfiles:state.dogs.filter(d=>!d.archived&&!d.adopted&&(d.dogNotes||[]).length).map(d=>({
      id:d.id,name:d.name,
      profile:{feedingSchedule:d.feedingShifts,food:d.food,medication:d.meds,walk:d.walk,behaviourWithPeople:d.withPeople,behaviourWithDogs:d.withDogs,status:d.rag,statusReason:d.ragReason,generalNotes:d.notes,tags:d.tags||[]},
      recentVolunteerNotes:(d.dogNotes||[]).slice(0,12).map(n=>({date:n.date,shift:n.shift||'',volunteer:n.volunteer||'Volunteer',category:noteCategory(n),text:n.text}))
    }))
  };
}

async function generateAIBriefing({force=false}={}){
  const el=document.getElementById('ai-briefing-output');if(!el)return;
  const shift=currentShift(),vols=getAvailableVols(shift),sk=shiftKey(),plan=state.shiftPlan[sk],s=state.settings;
  if(!plan||(!force&&state.aiBriefings[sk])||briefingRequests.has(sk))return;
  const apiUrl=(s.briefingApiUrl||'').trim();
  if(!apiUrl){el.innerHTML='<div class="card" style="font-size:13px;background:var(--color-background-warning);color:var(--color-text-warning)"><strong>AI briefing setup needed.</strong> Add the secure briefing API URL in Settings. Once connected, one briefing will generate automatically for every shift plan.</div>';return;}
  briefingRequests.add(sk);
  el.innerHTML='<div style="font-size:13px;color:var(--color-text-secondary)"><i class="ti ti-loader"></i> Generating this shift’s AI briefing…</div>';
  try{
    const r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(briefingPayload(shift,vols,plan,s))});
    const data=await r.json();
    if(!r.ok||!data.briefing)throw new Error(data.error||`Briefing service returned ${r.status}`);
    const dogIds=new Set(state.dogs.map(d=>d.id));
    const profileFlags=(Array.isArray(data.profileFlags)?data.profileFlags:[])
      .filter(f=>f&&dogIds.has(f.dogId)&&['medication','food','walk','general'].includes(f.category))
      .map((f,i)=>({...f,id:`${sk}-${f.dogId}-${f.category}-${i}`,shiftKey:sk,dismissed:false}));
    state.profileFlags=(state.profileFlags||[]).filter(f=>f.shiftKey!==sk).concat(profileFlags);
    state.aiBriefings[sk]={text:data.briefing,profileFlags,generatedAt:new Date().toISOString(),generatedAtLabel:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
    saveState();
    el.innerHTML=briefingMarkup(state.aiBriefings[sk]);
  }catch(e){el.innerHTML=`<div class="card" style="font-size:13px;background:var(--color-background-danger);color:var(--color-text-danger)"><strong>Briefing could not be generated.</strong> ${escapeHtml(e.message||'Check the briefing API in Settings.')} <button class="btn btn-sm" style="margin-left:6px" onclick="generateAIBriefing({force:true})">Try again</button></div>`;
  }finally{briefingRequests.delete(sk);}
}

// MAP
const MC=56,MG=6;
function renderMap(){
  document.getElementById('tab-map').innerHTML=`<div class="section-title">Shelter map</div><div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:1rem">Click any enclosure to see who's inside.</div><div style="overflow-x:auto"><div style="position:relative" id="map-root"></div></div><div id="enc-detail"></div>`;
  buildMap();
}
function buildMap(){
  const root=document.getElementById('map-root');if(!root)return;
  const col=i=>i*(MC+MG),y20=0,yMain=MC+MG,bigH=4*MC+3*MG,yBigBottom=yMain+bigH,yBottom=yMain+4*(MC+MG);

  const weekVolunteers=state.volunteers.filter(v=>dates.some(d=>isVolunteerPresentOn(v,d.toISOString().slice(0,10))));
  let html=`<div class="section-title">Rota</div><div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:1rem">Only volunteers whose stay covers this week are shown. Tap any active cell to toggle availability.</div><div style="overflow-x:auto"><table style="border-collapse:separate;border-spacing:4px"><thead><tr><th style="min-width:72px"></th>`;
  dates.forEach(d=>{const t=isToday(d);html+=`<th colspan="2" style="text-align:center;padding:2px 4px"><div style="font-size:11px;font-weight:${t?'500':'400'};color:var(--color-text-${t?'primary':'secondary'})">${d.toLocaleDateString('en-GB',{weekday:'short'})}</div><div style="font-size:10px;color:var(--color-text-${t?'info':'secondary'});font-weight:${t?'500':'400'}">${d.getDate()}/${d.getMonth()+1}</div></th>`;});
  html+=`</tr><tr><th></th>`;dates.forEach(()=>SHIFTS.forEach(s=>{html+=`<th style="text-align:center;font-size:10px;color:var(--color-text-secondary);font-weight:400;padding:0 2px">${s[0]}</th>`;}));
  html+=`</tr></thead><tbody>`;
  weekVolunteers.forEach(v=>{
    html+=`<tr><td style="font-size:13px;font-weight:500;padding:2px 6px;white-space:nowrap">${v.name}</td>`;
    dates.forEach(d=>{const dateStr=d.toISOString().slice(0,10),dn=dayNameFromDate(d),past=isPast(d),present=isVolunteerPresentOn(v,dateStr);SHIFTS.forEach(shift=>{const off=(v.offShifts||[]).find(o=>o.day===dn&&o.shift===shift),disabled=past||!present;html+=`<td style="padding:1px"><div class="rota-cell ${present?(off?'rota-off':'rota-on'):''}" style="${disabled?'opacity:0.3;cursor:default':''}" ${disabled?'':'onclick="toggleRota(\''+v.id+'\',\''+dn+'\',\''+shift+'\')"'}>${present?(off?'✕':'✓'):'–'}</div></td>`;});});
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  const morn=getAvailableVols('Morning'),eve=getAvailableVols('Evening');
  html+=`<div class="card" style="margin-top:1rem"><div style="font-weight:500;margin-bottom:6px">Today · ${todayStr}</div><div style="font-size:13px"><strong>Morning:</strong> ${morn.map(v=>v.name).join(', ')||'None'}</div><div style="font-size:13px;margin-top:4px"><strong>Evening:</strong> ${eve.map(v=>v.name).join(', ')||'None'}</div></div>`;
  document.getElementById('tab-rota').innerHTML=html;
}
function toggleRota(volId,day,shift){const v=state.volunteers.find(x=>x.id===volId);if(!v)return;if(!v.offShifts)v.offShifts=[];const idx=v.offShifts.findIndex(o=>o.day===day&&o.shift===shift);if(idx>=0)v.offShifts.splice(idx,1);else v.offShifts.push({day,shift});saveState();renderRota();}

// SETTINGS
function renderSettings(){
  const s=state.settings;
  document.getElementById('tab-settings').innerHTML=`<div class="section-title">Settings</div>
  <div class="card"><div style="font-weight:500;margin-bottom:1rem">Shift times</div>
    <label>Morning start</label><input type="text" id="s-ms" value="${s.morningStart}">
    <label>Morning end</label><input type="text" id="s-me" value="${s.morningEnd}">
    <label>Evening start</label><input type="text" id="s-es" value="${s.eveningStart}">
    <label>Evening end</label><input type="text" id="s-ee" value="${s.eveningEnd}">
  </div>
  <div class="card"><div style="font-weight:500;margin-bottom:1rem">Task durations (mins)</div>
    <label>Cleaning & water</label><input type="number" id="s-clean" value="${s.cleanMins}" min="10" max="180">
    <label>Feed & medicate</label><input type="number" id="s-feed" value="${s.feedMins}" min="5" max="60">
    <label>Walk per dog</label><input type="number" id="s-walk" value="${s.walkMins}" min="10" max="60">
    <label>Special dogs</label><input type="number" id="s-special" value="${s.specialMins}" min="10" max="60">
    <div id="capacity-preview" style="font-size:12px;color:var(--color-text-secondary);margin-top:4px;margin-bottom:12px"></div>
    <button class="btn btn-primary" onclick="saveSettings()">Save</button>
  </div>
  <div class="card"><div style="font-weight:500;margin-bottom:6px">Automatic AI briefing</div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">A briefing is generated once when each shift plan is created. The secure worker keeps the Anthropic API key out of this public website.</div>
    <label>Briefing API URL</label><input type="text" id="s-briefing-api" value="${escapeHtml(s.briefingApiUrl||'')}" placeholder="https://your-worker.workers.dev">
    <button class="btn btn-primary" onclick="saveSettings()">Save</button>
  </div>
  <div class="card"><div style="font-weight:500;margin-bottom:6px">Shift breakdown</div>
    <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.8">
      Total shift: 3 hours<br>
      Cleaners (${s.cleanMins} mins): clean & water · then walk until special dogs<br>
      Non-cleaners: feed & medicate (${s.feedMins} mins) · then walk<br>
      Everyone: special dogs · last ${s.specialMins} mins<br>
      Walk capacity per non-cleaner: ${Math.floor((180-s.feedMins-s.specialMins)/s.walkMins)} dogs<br>
      Walk capacity per cleaner: ${Math.floor(Math.max(0,180-s.cleanMins-s.specialMins)/s.walkMins)} dogs
    </div>
  </div>`;
  // live preview on change
  ['s-clean','s-feed','s-walk','s-special'].forEach(id=>{document.getElementById(id).oninput=updateCapacityPreview;});
  updateCapacityPreview();
}
function updateCapacityPreview(){
  const clean=parseInt(document.getElementById('s-clean').value)||75;
  const feed=parseInt(document.getElementById('s-feed').value)||20;
  const walk=parseInt(document.getElementById('s-walk').value)||20;
  const special=parseInt(document.getElementById('s-special').value)||30;
  const nonCleanerWalks=Math.floor((180-feed-special)/walk);
  const cleanerWalks=Math.floor(Math.max(0,180-clean-special)/walk);
  const el=document.getElementById('capacity-preview');
  if(el)el.textContent=`With 8 volunteers: ${nonCleanerWalks*6} walks (non-cleaners) + ${cleanerWalks*2} walks (cleaners) = ${nonCleanerWalks*6+cleanerWalks*2} total`;
}
function saveSettings(){
  state.settings={
    morningStart:document.getElementById('s-ms').value||'08:00',morningEnd:document.getElementById('s-me').value||'11:00',
    eveningStart:document.getElementById('s-es').value||'17:00',eveningEnd:document.getElementById('s-ee').value||'20:00',
    cleanMins:parseInt(document.getElementById('s-clean').value)||75,
    feedMins:parseInt(document.getElementById('s-feed').value)||20,
    walkMins:parseInt(document.getElementById('s-walk').value)||20,
    specialMins:parseInt(document.getElementById('s-special').value)||30,
    briefingApiUrl:document.getElementById('s-briefing-api').value.trim()
  };
  saveState();renderAll();renderSettings();
}

function showTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.nav button')[['shift','dogs','volunteers','map','rota','settings'].indexOf(tab)].classList.add('active');
  if(tab==='shift')renderShift();else if(tab==='dogs'){currentDogId=null;renderDogs();}else if(tab==='volunteers')renderVolunteers();else if(tab==='map')renderMap();else if(tab==='rota')renderRota();else if(tab==='settings')renderSettings();
}
function renderVolunteerSuggestions(){const el=document.getElementById('volunteer-suggestions');if(el)el.innerHTML=state.volunteers.filter(v=>isVolunteerPresentOn(v)).map(v=>`<option value="${escapeHtml(v.name)}"></option>`).join('');}
function renderAll(){document.getElementById('today-date').textContent=todayDisplay();document.getElementById('shift-indicator').textContent=currentShift()+' shift';renderVolunteerSuggestions();renderShift();}
loadState();
</script>
</body>
</html>
